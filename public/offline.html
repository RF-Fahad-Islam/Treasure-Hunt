<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Offline — Treasure Hunt</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #05030a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 360px;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 15px; color: #9ca3af; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 16px;
      border: none;
      background: #58cc02;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.12s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn:focus-visible { outline: 2px solid #58cc02; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>You're offline. Check your internet connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">⟳ Retry</button>
  </div>
</body>
</html>
