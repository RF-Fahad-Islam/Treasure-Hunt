<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Treasure Hunt - Active</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700;800&amp;family=Nunito+Sans:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#1f5100",
                        "inverse-primary": "#6be026",
                        "on-primary-container": "#1e5000",
                        "surface-container-highest": "#dde5d2",
                        "on-primary-fixed": "#082100",
                        "error-container": "#ffdad6",
                        "secondary": "#006590",
                        "surface-card": "#FFFFFF",
                        "surface-bright": "#f4fce8",
                        "primary-container": "#58cc02",
                        "inverse-on-surface": "#ecf4e0",
                        "outline": "#6f7b64",
                        "surface-background": "#F7F7F7",
                        "secondary-fixed-dim": "#88ceff",
                        "on-tertiary-container": "#7b1f60",
                        "surface-container-lowest": "#ffffff",
                        "reward-gold": "#FFC800",
                        "primary-fixed": "#87fe45",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#7d2061",
                        "on-primary": "#ffffff",
                        "on-background": "#171e12",
                        "on-surface-variant": "#3f4a36",
                        "tertiary-container": "#ff8ed4",
                        "background": "#f4fce8",
                        "danger-red": "#FF4B4B",
                        "outline-variant": "#becbb1",
                        "tertiary-fixed": "#ffd8eb",
                        "on-surface": "#171e12",
                        "on-secondary-container": "#004666",
                        "surface": "#f4fce8",
                        "surface-dim": "#d5ddca",
                        "tertiary-fixed-dim": "#ffaedd",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2b3326",
                        "secondary-fixed": "#c8e6ff",
                        "surface-container-high": "#e3ebd8",
                        "primary": "#2b6c00",
                        "secondary-container": "#2fb8ff",
                        "on-secondary-fixed": "#001e2e",
                        "surface-container": "#e9f1dd",
                        "surface-variant": "#dde5d2",
                        "surface-container-low": "#eef7e3",
                        "on-secondary-fixed-variant": "#004c6e",
                        "text-secondary": "#777777",
                        "primary-fixed-dim": "#6be026",
                        "text-primary": "#2B2B2B",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#2b6c00",
                        "on-tertiary-fixed": "#3b002c",
                        "tertiary": "#9a397a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "lg": "32px",
                        "xs": "8px",
                        "sm": "16px",
                        "xl": "48px",
                        "unit": "8px",
                        "md": "24px",
                        "container-margin": "24px",
                        "xxl": "64px"
                    },
                    "fontFamily": {
                        "label-bold": ["Lexend", "sans-serif"],
                        "body-md": ["Nunito Sans", "sans-serif"],
                        "body-lg": ["Nunito Sans", "sans-serif"],
                        "headline-lg": ["Nunito Sans", "sans-serif"],
                        "timer-display-mobile": ["Lexend", "sans-serif"],
                        "headline-xl": ["Nunito Sans", "sans-serif"],
                        "headline-xl-mobile": ["Nunito Sans", "sans-serif"],
                        "timer-display": ["Lexend", "sans-serif"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "timer-display-mobile": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
                        "timer-display": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .tactile-shadow {
            box-shadow: 0 12px 24px -4px rgba(0,0,0,0.12);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-background text-on-background font-body-md text-body-md min-h-screen flex flex-col pb-[100px]">
<!-- TopAppBar Shared Component -->
<header class="flex justify-between items-center w-full px-container-margin py-xs max-w-7xl mx-auto bg-surface text-primary flat no shadows docked full-width top-0 z-40 sticky">
<button aria-label="Leaderboard" class="hover:opacity-80 p-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary text-center flex-1">Treasure Hunt</h1>
<button aria-label="Stars" class="hover:opacity-80 p-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">stars</span>
</button>
</header>
<!-- Hunt Progress Bar -->
<div class="px-container-margin py-sm bg-surface-container-highest rounded-b-xl flex justify-between items-center mx-xs shadow-sm mb-lg">
<div class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wide">
            Checkpoint 3/8
        </div>
<div class="font-label-bold text-label-bold text-reward-gold flex items-center gap-xs bg-surface-card px-3 py-1 rounded-full border-b-2 border-outline-variant">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">toll</span>
            2400 pts
        </div>
</div>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center px-container-margin w-full max-w-lg mx-auto">
<!-- Timer -->
<div class="flex flex-col items-center justify-center my-xl w-full">
<div class="font-timer-display-mobile text-timer-display-mobile text-primary-container drop-shadow-md tracking-tight">
                29:41
            </div>
<div class="font-label-bold text-label-bold text-text-secondary mt-xs tracking-widest text-center">
                TIME REMAINING
            </div>
</div>
<!-- Clue Card -->
<div class="w-full bg-surface-card rounded-[24px] p-lg tactile-shadow flex flex-col items-center text-center relative mt-sm mb-auto">
<!-- Decorative pin -->
<div class="absolute -top-6 bg-surface-container-lowest p-2 rounded-full shadow-md border-b-4 border-surface-container-highest">
<span class="material-symbols-outlined text-[32px] text-danger-red" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div class="mt-xs mb-sm font-label-bold text-label-bold text-on-surface-variant tracking-wider uppercase">
                Current Clue
            </div>
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-text-primary mt-sm mb-md px-sm leading-snug">
                Go where books sleep quietly.
            </h2>
</div>
<!-- Primary Action -->
<div class="w-full mt-xl mb-md">
<button class="w-full bg-primary-container text-on-primary-container font-headline-lg-mobile text-headline-lg-mobile py-sm rounded-full border-b-4 border-on-primary-container active:translate-y-1 active:border-b-0 transition-all tactile-shadow flex items-center justify-center gap-sm h-[64px]">
                SUBMIT LOCATION
            </button>
</div>
</main>
<!-- BottomNavBar Shared Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-xs py-sm bg-surface-container-lowest border-t-4 border-surface-container-highest shadow-lg rounded-t-xl">
<!-- Active Nav Item -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-2 border-b-4 border-on-primary-container translate-y-1 transition-all duration-100 min-w-[72px]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">explore</span>
<span class="font-label-bold text-label-bold mt-1">Hunt</span>
</button>
<!-- Inactive Nav Items -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-xl min-w-[72px] transition-colors">
<span class="material-symbols-outlined">map</span>
<span class="font-label-bold text-label-bold mt-1">Map</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-xl min-w-[72px] transition-colors">
<span class="material-symbols-outlined">military_tech</span>
<span class="font-label-bold text-label-bold mt-1">League</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high rounded-xl min-w-[72px] transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="font-label-bold text-label-bold mt-1">Profile</span>
</button>
</nav>
</body></html>
