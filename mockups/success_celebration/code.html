<style>
        /* Custom styles for confetti or celebration background if needed, leveraging tailwind mostly */
        .confetti-bg {
            background-image: radial-gradient(circle at 20% 30%, theme('colors.primary-container') 2px, transparent 3px),
                              radial-gradient(circle at 80% 40%, theme('colors.reward-gold') 3px, transparent 4px),
                              radial-gradient(circle at 40% 70%, theme('colors.secondary-container') 2px, transparent 3px),
                              radial-gradient(circle at 70% 80%, theme('colors.tertiary-container') 2px, transparent 3px),
                              radial-gradient(circle at 10% 80%, theme('colors.danger-red') 2px, transparent 3px),
                              radial-gradient(circle at 90% 10%, theme('colors.primary') 3px, transparent 4px);
            background-size: 100px 100px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">
<!-- Celebration Background Layer -->
<div class="absolute inset-0 confetti-bg opacity-30 pointer-events-none z-0"></div>
<!-- Large subtle radial gradient for depth -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-surface-bright via-surface-background to-surface-dim opacity-80 pointer-events-none z-0"></div>
<!-- Main Content Container -->
<main class="flex-1 flex flex-col items-center justify-center px-container-margin py-xxl relative z-10 w-full max-w-md mx-auto h-screen">
<!-- Celebration Header -->
<div class="text-center mb-xl">
<span class="material-symbols-outlined text-[80px] text-reward-gold mb-sm block" style="font-variation-settings: 'FILL' 1;">
                celebration
            </span>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-primary tracking-tight">
                🎉 NICE!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-xs">
                Mission Accomplished
            </p>
</div>
<!-- Points & Stats Card -->
<div class="w-full bg-surface-card rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-lg flex flex-col items-center mb-xl relative overflow-hidden">
<!-- Subtle background accent inside card -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-reward-gold opacity-10 rounded-full blur-2xl"></div>
<div class="flex flex-col items-center justify-center text-center">
<span class="font-label-bold text-label-bold text-outline mb-xs uppercase tracking-wider">Rewards Earned</span>
<div class="flex items-center gap-2 mb-md">
<span class="material-symbols-outlined text-[40px] text-reward-gold" style="font-variation-settings: 'FILL' 1;">
                        stars
                    </span>
<span class="font-timer-display-mobile text-timer-display-mobile text-reward-gold" style="text-shadow: 0 2px 4px rgba(255, 200, 0, 0.2);">
                        +700
                    </span>
</div>
<div class="w-full h-px bg-surface-container-highest my-sm"></div>
<div class="flex items-center justify-between w-full px-sm mt-xs">
<span class="font-body-md text-body-md text-on-surface-variant">Updated Rank</span>
<div class="flex items-center gap-1 bg-surface-container-low px-3 py-1 rounded-full border border-surface-container-highest">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 1;">
                            trending_up
                        </span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">#2</span>
</div>
</div>
</div>
</div>
<!-- Spacer to push button down -->
<div class="flex-1"></div>
<!-- Action Button -->
<div class="w-full pb-md">
<button class="w-full h-[64px] bg-primary text-on-primary font-label-bold text-label-bold rounded-full flex items-center justify-center gap-2 shadow-[0_4px_0_0_#1f5100] hover:translate-y-[2px] hover:shadow-[0_2px_0_0_#1f5100] transition-all active:translate-y-[4px] active:shadow-none text-[18px]">

                    arrow_forward
                </span>
</button>
</div>
