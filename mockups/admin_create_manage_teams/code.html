<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Control - Team Management</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800&amp;family=Lexend:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#9a397a",
                        "surface-card": "#FFFFFF",
                        "primary-fixed-dim": "#6be026",
                        "surface-tint": "#2b6c00",
                        "on-surface-variant": "#3f4a36",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#88ceff",
                        "secondary-fixed": "#c8e6ff",
                        "outline-variant": "#becbb1",
                        "on-tertiary-fixed-variant": "#7d2061",
                        "on-secondary-fixed-variant": "#004c6e",
                        "inverse-on-surface": "#ecf4e0",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#1f5100",
                        "on-surface": "#171e12",
                        "on-background": "#171e12",
                        "secondary": "#006590",
                        "text-secondary": "#777777",
                        "outline": "#6f7b64",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e3ebd8",
                        "tertiary-fixed-dim": "#ffaedd",
                        "on-secondary-container": "#004666",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "primary-fixed": "#87fe45",
                        "on-secondary-fixed": "#001e2e",
                        "on-primary": "#ffffff",
                        "surface-variant": "#dde5d2",
                        "inverse-surface": "#2b3326",
                        "tertiary-container": "#ff8ed4",
                        "surface-container": "#e9f1dd",
                        "primary-container": "#58cc02",
                        "surface-bright": "#f4fce8",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#1e5000",
                        "reward-gold": "#FFC800",
                        "surface-dim": "#d5ddca",
                        "text-primary": "#2B2B2B",
                        "surface": "#f4fce8",
                        "on-error": "#ffffff",
                        "primary": "#2b6c00",
                        "danger-red": "#FF4B4B",
                        "secondary-container": "#2fb8ff",
                        "surface-background": "#F7F7F7",
                        "on-tertiary-fixed": "#3b002c",
                        "inverse-primary": "#6be026",
                        "surface-container-low": "#eef7e3",
                        "background": "#f4fce8",
                        "on-tertiary-container": "#7b1f60",
                        "on-primary-fixed": "#082100",
                        "tertiary-fixed": "#ffd8eb",
                        "surface-container-highest": "#dde5d2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "32px",
                        "unit": "8px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "xl": "48px",
                        "sm": "16px",
                        "xs": "8px",
                        "md": "24px",
                        "xxl": "64px"
                    },
                    "fontFamily": {
                        "body-md": ["Nunito Sans"],
                        "headline-xl": ["Nunito Sans"],
                        "headline-lg": ["Nunito Sans"],
                        "timer-display-mobile": ["Lexend"],
                        "timer-display": ["Lexend"],
                        "label-bold": ["Lexend"],
                        "headline-xl-mobile": ["Nunito Sans"],
                        "body-lg": ["Nunito Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "timer-display-mobile": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "timer-display": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #F7F7F7;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom thick border buttons simulating 3D */
        .btn-3d {
            border-bottom-width: 4px;
            transition: all 0.1s ease;
        }
        .btn-3d:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-bottom: 2px;
        }
        /* Soft shadows for cards */
        .card-shadow {
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface pb-32">
<!-- TopAppBar -->
<header class="bg-surface border-b-4 border-surface-container-highest flex items-center justify-between px-md py-sm w-full h-20 sticky top-0 z-50">
<button class="text-primary hover:bg-surface-container-low p-2 rounded-full transition-all active:scale-95 duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-black text-primary">Admin Control</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin pt-md flex flex-col gap-xl">
<!-- Section 1: Create New Team -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface mb-sm">Create New Team</h2>
<div class="bg-surface-card rounded-[24px] p-lg card-shadow flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Team Name</label>
<input class="w-full bg-surface-background border-2 border-surface-container-highest rounded-xl p-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary-container transition-colors placeholder-text-secondary" placeholder="e.g. Code Breakers" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Team Color</label>
<div class="flex justify-between items-center py-xs">
<button class="w-12 h-12 rounded-full bg-danger-red border-4 border-surface-card shadow-[0_0_0_2px_#FF4B4B] active:scale-95 transition-transform"></button>
<button class="w-12 h-12 rounded-full bg-secondary-container opacity-50 hover:opacity-100 active:scale-95 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-primary-container opacity-50 hover:opacity-100 active:scale-95 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-reward-gold opacity-50 hover:opacity-100 active:scale-95 transition-all"></button>
<button class="w-12 h-12 rounded-full bg-tertiary opacity-50 hover:opacity-100 active:scale-95 transition-all"></button>
</div>
</div>
<button class="w-full mt-xs bg-primary-container text-on-primary-container font-label-bold text-label-bold text-lg py-sm rounded-full btn-3d border-primary hover:brightness-105">
                    Create Team
                </button>
</div>
</section>
<!-- Section 2: Add Members -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface mb-sm">Add Members</h2>
<div class="bg-surface-card rounded-[24px] p-lg card-shadow flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider">Invite by Email</label>
<div class="flex gap-sm">
<input class="flex-1 bg-surface-background border-2 border-surface-container-highest rounded-xl p-sm font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-secondary-container transition-colors placeholder-text-secondary" placeholder="player@email.com" type="email"/>
<button class="w-[56px] h-[56px] flex items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl btn-3d border-[#0090FF] active:scale-95">
<span class="material-symbols-outlined font-bold text-[32px]">add</span>
</button>
</div>
</div>
<!-- Pending Members List -->
<div class="mt-sm">
<p class="font-label-bold text-label-bold text-text-secondary mb-sm">Pending Invites (2)</p>
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between bg-surface-background p-sm rounded-xl border border-surface-container-highest">
<span class="font-body-md text-body-md text-on-surface">sarah.j@email.com</span>
<button class="text-text-secondary hover:text-danger-red transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex items-center justify-between bg-surface-background p-sm rounded-xl border border-surface-container-highest">
<span class="font-body-md text-body-md text-on-surface">mike_runner99</span>
<button class="text-text-secondary hover:text-danger-red transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</div>
</div>
</div>
</section>
<!-- Section 3: Recently Created Teams -->
<section>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface mb-sm">Recent Teams</h2>
<div class="flex flex-col gap-md">
<!-- Team Card 1 -->
<div class="bg-surface-card rounded-[24px] p-sm card-shadow border-l-8 border-danger-red flex items-center justify-between active:scale-[0.98] transition-transform">
<div class="flex items-center gap-sm">
<div class="w-12 h-12 bg-surface-background rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-danger-red" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<div>
<h3 class="font-headline-lg-mobile text-[20px] font-bold text-on-surface leading-tight">Red Foxes</h3>
<p class="font-body-md text-[14px] text-text-secondary">4 Members</p>
</div>
</div>
<button class="p-2 text-outline hover:text-primary transition-colors rounded-full">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
<!-- Team Card 2 -->
<div class="bg-surface-card rounded-[24px] p-sm card-shadow border-l-8 border-secondary-container flex items-center justify-between active:scale-[0.98] transition-transform">
<div class="flex items-center gap-sm">
<div class="w-12 h-12 bg-surface-background rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<div>
<h3 class="font-headline-lg-mobile text-[20px] font-bold text-on-surface leading-tight">Blue Sharks</h3>
<p class="font-body-md text-[14px] text-text-secondary">3 Members</p>
</div>
</div>
<button class="p-2 text-outline hover:text-primary transition-colors rounded-full">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
</div>
</section>
</main>
</body></html>
