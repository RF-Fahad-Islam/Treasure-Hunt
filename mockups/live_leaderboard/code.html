</button>

<p class="font-body-md text-body-md text-text-secondary">Updates in real-time. Keep pushing!</p>
</div>

<div class="flex justify-center items-end gap-xs md:gap-md h-64 mt-lg relative w-full px-sm">
<!-- 2nd Place: Team Alpha (User) -->

<div class="absolute top-10 font-timer-display-mobile text-timer-display-mobile text-on-surface-variant opacity-40">2</div>
<div class="bg-primary-container text-on-primary-container rounded-t-xl w-full h-[60%] flex flex-col items-center justify-start pt-sm tactile-shadow border-b-[6px] border-on-primary-container transition-transform hover:-translate-y-1">

</div>

<span class="font-headline-lg text-headline-lg text-reward-gold mt-auto pb-sm drop-shadow-sm">2800</span>
</div>
</div>

<div class="absolute top-20 font-timer-display-mobile text-timer-display-mobile text-on-surface-variant opacity-40">3</div>

<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface-variant mt-auto pb-sm">2100</span>
