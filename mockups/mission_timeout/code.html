<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Timeout Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@700;800&amp;family=Nunito+Sans:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style type="text/tailwindcss">
        @layer utilities {
            .material-symbols-outlined {
                font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            }
            .material-symbols-outlined[data-weight="fill"] {
                font-variation-settings: 'FILL' 1;
            }
            .shadow-tactile {
                box-shadow: 0 4px 0 0 theme('colors.primary-container');
            }
            .shadow-tactile-active {
                box-shadow: 0 0px 0 0 theme('colors.primary-container');
                transform: translateY(4px);
            }
            .glass-card {
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.3);
            }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#1f5100",
                        "inverse-primary": "#6be026",
                        "on-primary-container": "#1e5000",
                        "surface-container-highest": "#dde5d2",
                        "on-primary-fixed": "#082100",
                        "error-container": "#ffdad6",
                        "secondary": "#006590",
                        "surface-card": "#FFFFFF",
                        "surface-bright": "#f4fce8",
                        "primary-container": "#58cc02",
                        "inverse-on-surface": "#ecf4e0",
                        "outline": "#6f7b64",
                        "surface-background": "#F7F7F7",
                        "secondary-fixed-dim": "#88ceff",
                        "on-tertiary-container": "#7b1f60",
                        "surface-container-lowest": "#ffffff",
                        "reward-gold": "#FFC800",
                        "primary-fixed": "#87fe45",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#7d2061",
                        "on-primary": "#ffffff",
                        "on-background": "#171e12",
                        "on-surface-variant": "#3f4a36",
                        "tertiary-container": "#ff8ed4",
                        "background": "#f4fce8",
                        "danger-red": "#FF4B4B",
                        "outline-variant": "#becbb1",
                        "tertiary-fixed": "#ffd8eb",
                        "on-surface": "#171e12",
                        "on-secondary-container": "#004666",
                        "surface": "#f4fce8",
                        "surface-dim": "#d5ddca",
                        "tertiary-fixed-dim": "#ffaedd",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2b3326",
                        "secondary-fixed": "#c8e6ff",
                        "surface-container-high": "#e3ebd8",
                        "primary": "#2b6c00",
                        "secondary-container": "#2fb8ff",
                        "on-secondary-fixed": "#001e2e",
                        "surface-container": "#e9f1dd",
                        "surface-variant": "#dde5d2",
                        "surface-container-low": "#eef7e3",
                        "on-secondary-fixed-variant": "#004c6e",
                        "text-secondary": "#777777",
                        "primary-fixed-dim": "#6be026",
                        "text-primary": "#2B2B2B",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#2b6c00",
                        "on-tertiary-fixed": "#3b002c",
                        "tertiary": "#9a397a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "lg": "32px",
                        "xs": "8px",
                        "sm": "16px",
                        "xl": "48px",
                        "unit": "8px",
                        "md": "24px",
                        "container-margin": "24px",
                        "xxl": "64px"
                    },
                    "fontFamily": {
                        "label-bold": ["Lexend"],
                        "body-md": ["Nunito Sans"],
                        "body-lg": ["Nunito Sans"],
                        "headline-lg": ["Nunito Sans"],
                        "timer-display-mobile": ["Lexend"],
                        "headline-xl": ["Nunito Sans"],
                        "headline-xl-mobile": ["Nunito Sans"],
                        "timer-display": ["Lexend"]
                    },
                    "fontSize": {
                        "label-bold": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "timer-display-mobile": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "fontWeight": "800" }],
                        "headline-xl-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "800" }],
                        "timer-display": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden relative">
<!-- Background Decorative Elements for Gamified Feel -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-danger-red opacity-[0.05] rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-reward-gold opacity-[0.05] rounded-full blur-[120px]"></div>
<!-- Abstract Pattern Overlay -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(var(--tw-colors-text-primary) 2px, transparent 2px); background-size: 32px 32px;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin py-xxl relative z-10 w-full max-w-md mx-auto h-screen">
<!-- Illustration/Icon Container -->
<div class="mb-lg relative w-48 h-48 flex items-center justify-center">
<!-- Animated rings (CSS only via static classes simulating the look) -->
<div class="absolute inset-0 border-4 border-danger-red/20 rounded-full scale-110"></div>
<div class="absolute inset-0 border-4 border-danger-red/10 rounded-full scale-125"></div>
<!-- Central Icon -->
<div class="w-32 h-32 bg-surface-card rounded-full flex items-center justify-center shadow-[0_8px_32px_rgba(255,75,75,0.2)] relative z-10">
<span class="material-symbols-outlined text-7xl text-danger-red" data-weight="fill">
                    timer_off
                </span>
</div>
<!-- Decorative floating bits -->
<span class="material-symbols-outlined text-danger-red absolute top-0 right-4 text-2xl rotate-12 opacity-50">hourglass_empty</span>
<span class="material-symbols-outlined text-reward-gold absolute bottom-4 left-0 text-3xl -rotate-12 opacity-50">star</span>
</div>
<!-- Text Content -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-danger-red mb-sm">
                MISSION EXPIRED
            </h1>
<p class="font-body-lg text-body-lg text-text-secondary max-w-[280px] mx-auto">
                No worries! A new clue is unlocking... Dust yourself off and let's keep moving!
            </p>
</div>
<!-- Action Button -->
<div class="w-full mt-auto mb-lg pb-md">
<button class="w-full bg-primary-fixed-dim text-on-primary-fixed-variant font-label-bold text-label-bold py-4 px-6 rounded-full shadow-[0_6px_0_0_theme('colors.primary-container')] hover:shadow-[0_4px_0_0_theme('colors.primary-container')] hover:translate-y-[2px] active:shadow-none active:translate-y-[6px] transition-all flex items-center justify-center gap-2 group h-[64px]">
                GET NEXT CLUE
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">
                    arrow_forward
                </span>
</button>
<p class="text-center mt-sm text-sm text-text-secondary/70">
                Next clue ready in 3s...
            </p>
</div>
</main>
</body></html>
